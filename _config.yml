# ── 사이트 정보 ────────────────────────────────────────────────
title: groovallstar
tagline: 개발 기록
description: >-
  개발하면서 배운 것들을 기록합니다.
url: "https://groovallstar.github.io"
baseurl: ""

lang: ko-KR
timezone: Asia/Seoul

author:
  name: groovallstar
  email:

github:
  username: groovallstar

goatcounter:
  code: "marrh"
  production_host: "groovallstar.github.io"

# 홈 상단 인사말 (PaperMod 의 home-info 영역)
home_info:
  title: "기록하는 개발자"
  content: "groovallstar · 읽고, 만들고, 남깁니다"

# 헤더 네비게이션
nav:
  - title: Posts
    url: /
  - title: Categories
    url: /categories/
  - title: Tags
    url: /tags/

# 홈/포스트 하단 소셜 아이콘 (지원 값: github, email)
social_icons:
  - type: github
    url: https://github.com/groovallstar

# ── 빌드 설정 ─────────────────────────────────────────────────
plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

paginate: 10
paginate_path: "/page:num/"

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - "*.gemspec"
  - LICENSE
  - README.md
  - tools
  - vendor
  - .devcontainer
