{%- if jekyll.environment == "production" and site.goatcounter and site.goatcounter.code and site.goatcounter.code != empty and site.goatcounter.production_host and site.goatcounter.production_host != empty -%}
<script async
        src="{{ '/assets/js/analytics.js' | relative_url }}"
        data-goatcounter-endpoint="https://{{ site.goatcounter.code | escape }}.goatcounter.com/count"
        data-goatcounter-host="{{ site.goatcounter.production_host | escape }}"></script>
{%- endif -%}
