<header class="header">
  <nav class="nav">
    <div class="logo">
      <a href="{{ '/' | relative_url }}" accesskey="h" title="{{ site.title }} (Alt + H)">{{ site.title }}</a>
      <span class="logo-switches">
        <button id="theme-toggle" accesskey="t" title="테마 전환 (Alt + T)" aria-label="테마 전환">
          <svg id="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </span>
    </div>
    <ul id="menu">
      {%- assign current = page.url | default: '/' -%}
      {%- for item in site.nav -%}
        {%- assign item_url = item.url | relative_url -%}
        <li>
          <a href="{{ item_url }}" title="{{ item.title }}">
            <span{% if current == item.url %} class="active"{% endif %}>{{ item.title }}</span>
          </a>
        </li>
      {%- endfor -%}
    </ul>
  </nav>
</header>
