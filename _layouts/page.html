---
layout: default
---
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.description -%}
    <div class="post-description">{{ page.description }}</div>
    {%- endif -%}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
